name: Update vault-ui cask

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest vault-ui release
        id: rel
        run: |
          JSON=$(gh api repos/bborbe/vault-ui/releases/latest)
          TAG=$(printf '%s' "$JSON" | jq -r '.tag_name' | sed 's/^v//')
          ASSET=$(printf '%s' "$JSON" | jq -r '.assets[] | select(.name | startswith("vault_ui-")) | .browser_download_url')
          if [ -z "$ASSET" ]; then
            echo "no wheel asset on latest vault-ui release — release-wheel workflow may have failed"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute wheel sha256
        id: sha
        run: |
          SHA=$(curl -sL "${{ steps.rel.outputs.asset }}" | shasum -a 256 | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Bump cask if a newer release exists
        id: bump
        run: |
          CURRENT=$(sed -nE 's/^  version "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' Casks/vault-ui.rb)
          NEW="${{ steps.rel.outputs.tag }}"
          if [ "$CURRENT" = "$NEW" ]; then
            echo "cask already current ($CURRENT)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s/  version \"$CURRENT\"/  version \"$NEW\"/" Casks/vault-ui.rb
          sed -i -E "s/  sha256 \"[0-9a-f]{64}\"/  sha256 \"${{ steps.sha.outputs.sha256 }}\"/" Casks/vault-ui.rb
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Open bump PR
        if: steps.bump.outputs.changed == 'true'
        run: |
          VER="${{ steps.bump.outputs.new_version }}"
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --json title \
             --jq "any(.title == \"vault-ui $VER\")" | grep -q true; then
            echo "bump PR for $VER already open"
            exit 0
          fi
          BRANCH="update/vault-ui-$VER"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/vault-ui.rb
          git commit -m "vault-ui $VER"
          git push -u origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --title "vault-ui $VER" \
            --body "Auto-bump by the update-vault-ui-cask workflow (release-wheel workflow attached a new wheel)." \
            --base master
        env:
          GH_TOKEN: ${{ github.token }}
